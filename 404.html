<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página no encontrada · Windsor</title>
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <style>
    :root {
      --bg: #0e0e10;
      --fg: #f5f5f7;
      --muted: #9a9aa2;
      --accent: #f5f5f7;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.5;
    }
    main {
      max-width: 520px;
      text-align: left;
    }
    .code {
      font-size: 14px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 12px;
    }
    h1 {
      font-size: clamp(28px, 6vw, 44px);
      line-height: 1.1;
      margin: 0 0 16px;
      font-weight: 600;
    }
    p {
      color: var(--muted);
      margin: 0 0 24px;
      font-size: 16px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    a.btn {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      color: var(--accent);
      text-decoration: none;
      font-size: 15px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    a.btn.primary {
      background: var(--accent);
      color: var(--bg);
    }
    a.btn:hover {
      opacity: 0.85;
    }
    footer {
      margin-top: 40px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>Esta página no existe.</h1>
    <p>Puede que la hayamos movido, que el enlace esté mal escrito o que ya no esté disponible. Desde aquí puedes volver a lo que sí sigue en pie.</p>
    <div class="actions">
      <a class="btn primary" href="index.html">Volver al inicio</a>
      <a class="btn" href="contacto.html">Contacto</a>
    </div>
    <footer>Windsor · <a href="windsor-one.html" style="color:inherit;">Windsor One</a></footer>
  </main>
</body>
</html>
