<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página no encontrada · Windsor</title>
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* --- Solo lo específico de la 404. El resto lo hereda de styles.css --- */
    .e404 {
      min-height: calc(100vh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
    }
    .e404__inner {
      max-width: 560px;
      width: 100%;
    }
    .e404__code {
      font-size: 13px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      opacity: 0.6;
      margin: 0 0 14px;
    }
    .e404__title {
      font-size: clamp(30px, 6vw, 52px);
      line-height: 1.05;
      margin: 0 0 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .e404__text {
      font-size: 16px;
      line-height: 1.6;
      opacity: 0.75;
      margin: 0 0 32px;
    }
    .e404__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .e404__btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 15px;
      text-decoration: none;
      border: 1px solid currentColor;
      color: inherit;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }
    .e404__btn:hover {
      transform: translateY(-1px);
    }
    .e404__btn--primary {
      background: currentColor;
      border-color: currentColor;
    }
    .e404__btn--primary span {
      color: var(--bg, #0e0e10);
    }

    /* --- Animaciones de entrada (solo contenido central) --- */
    @keyframes e404-up {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .e404 [data-anim] {
      opacity: 0;
      animation: e404-up 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .e404 [data-anim="1"] { animation-delay: 0.05s; }
    .e404 [data-anim="2"] { animation-delay: 0.18s; }
    .e404 [data-anim="3"] { animation-delay: 0.32s; }
    .e404 [data-anim="4"] { animation-delay: 0.46s; }

    @media (prefers-reduced-motion: reduce) {
      .e404 [data-anim] {
        opacity: 1;
        animation: none;
      }
    }
  </style>
</head>
<body>

  <!-- ============================================================
       PEGA AQUÍ TU HEADER REAL (tal cual está en index.html)
       Ejemplo de estructura, reemplázalo por el tuyo:
       ============================================================ -->
  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="site-header__brand">Windsor</a>
      <nav class="site-header__nav">
        <a href="index.html">Inicio</a>
        <a href="windsor-one.html">Windsor One</a>
        <a href="metodologia.html">Metodología</a>
        <a href="contacto.html">Contacto</a>
      </nav>
    </div>
  </header>
  <!-- ======================= FIN HEADER ======================== -->


  <main class="e404">
    <div class="e404__inner">
      <p class="e404__code" data-anim="1">Error 404</p>
      <h1 class="e404__title" data-anim="2">Esta página no existe.</h1>
      <p class="e404__text" data-anim="3">
        Puede que la hayamos movido, que el enlace esté mal escrito o que ya no esté disponible.
        Desde aquí puedes volver a lo que sí sigue en pie.
      </p>
      <div class="e404__actions" data-anim="4">
        <a href="index.html" class="e404__btn e404__btn--primary"><span>Volver al inicio</span></a>
        <a href="contacto.html" class="e404__btn">Contacto</a>
      </div>
    </div>
  </main>


  <!-- ============================================================
       PEGA AQUÍ TU FOOTER REAL (tal cual está en index.html)
       ============================================================ -->
  <footer class="site-footer">
    <div class="site-footer__inner">
      <p>© Windsor. <a href="windsor-one.html">Windsor One</a></p>
    </div>
  </footer>
  <!-- ======================= FIN FOOTER ======================== -->

</body>
</html>
